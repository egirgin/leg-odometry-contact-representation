# DAE+GMM on an OCELOT (Unitree Go2) sequence, using the shipped pretrained CNN encoder.
# Swap model_dir for pretrained/ocelot/autoencoder_gru to use the GRU encoder instead.
#
#   python main.py --config config/ocelot_dae_gmm.yaml

schema_version: 1

run:
  name: ocelot_dae_gmm
  debug: true

robot:
  kinematics: go2

dataset:
  kind: ocelot
  # Sample sequence shipped with this repo; point elsewhere for your own recordings.
  sequence_dir: ./data/ocelot/rock/forward

contact:
  detector: autoencoder
  autoencoder:
    mode: offline
    model_dir: ./pretrained/ocelot/autoencoder_cnn
    stance_probability_threshold: 0.5
    device: null
    encode_batch_size: 256
    gmm:
      pretrained: true

ekf:
  noise_config: config/ekf_noise/default.yaml
  initialize_nominal_from_data: false

output:
  base_dir: output
  include_timestamp: true

# Precompute instant kinematic features for TartanGround sequences.
#   python -m leg_odom.features.precompute_contact_instants --config leg_odom/features/default_precompute_config.yaml

dataset_root: ./data/tartanground/processed
output_root: ./leg_odom/features/precomputed_tartanground
dataset_kind: tartanground
robot: anymal
overwrite: false
verbose: true
feature_fields: [est_tau_calf, v_foot_body_x, v_foot_body_y, v_foot_body_z, p_foot_body_z]
